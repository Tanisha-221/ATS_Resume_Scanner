<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ATS Resume Matcher</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

<h2 class="text-center mb-4">ATS Resume & Job Description Matcher</h2>

<ul class="nav nav-tabs justify-content-center">
  <li class="nav-item">
    <a class="nav-link active" data-bs-toggle="tab" href="#jobSeeker">Job Seeker</a>
  </li>
  <li class="nav-item">
    <a class="nav-link" data-bs-toggle="tab" href="#hiringTeam">Hiring Team</a>
  </li>
</ul>

<div class="tab-content mt-4">

<!-- JOB SEEKER TAB -->
<div class="tab-pane fade show active" id="jobSeeker">
<form method="POST" enctype="multipart/form-data">

<input type="hidden" name="role" value="job_seeker">

<label class="fw-semibold">Select Job Role</label>
<select name="job_role" class="form-select mb-3" required>
  <option value="">-- Select Role --</option>
  <option value="sre">Site Reliability Engineer (SRE)</option>
  <option value="devops">DevOps Engineer</option>
  <option value="backend">Backend Developer</option>
  <option value="frontend">Frontend Developer</option>
  <option value="ai_ml">AI / ML Engineer</option>
  <option value="cybersecurity">Cybersecurity Engineer</option>
  <option value="data_engineer">Data Engineer</option>
  <option value="cloud">Cloud Engineer</option>
</select>

<label class="fw-semibold">Upload Resume(s)</label>
<input type="file" name="resumes" class="form-control mb-3" multiple required>

<label class="fw-semibold">Paste Job Description (Optional)</label>
<textarea name="jd" class="form-control" rows="4"></textarea>

<button class="btn btn-primary w-100 mt-3">Analyze Resume</button>

</form>
</div>

<!-- HIRING TEAM TAB -->
<div class="tab-pane fade" id="hiringTeam">
<form method="POST" enctype="multipart/form-data">

<input type="hidden" name="role" value="hiring_team">

<label class="fw-semibold">Select Job Role</label>
<select name="job_role" class="form-select mb-3" required>
  <option value="">-- Select Role --</option>
  <option value="sre">Site Reliability Engineer (SRE)</option>
  <option value="devops">DevOps Engineer</option>
  <option value="backend">Backend Developer</option>
  <option value="frontend">Frontend Developer</option>
  <option value="ai_ml">AI / ML Engineer</option>
  <option value="cybersecurity">Cybersecurity Engineer</option>
  <option value="data_engineer">Data Engineer</option>
  <option value="m365">M365 Engineer</option>
  <option value="cloud_engineer">Cloud Engineer</option>
</select>

</select>

<label class="fw-semibold">Paste Job Description (Optional)</label>
<textarea name="jd_text" class="form-control mb-3" rows="4"></textarea>

<label class="fw-semibold">Upload Candidate Resumes</label>
<input type="file" name="job_seekers" class="form-control mb-3" multiple required>

<button class="btn btn-success w-100">Rank Candidates</button>

</form>
</div>

</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
